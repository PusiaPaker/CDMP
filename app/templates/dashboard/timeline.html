{% extends './base/dashboard.html' %}

{% block title %}
    Dashboard
{% endblock %}

{% block dashboard_page_name %}
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="ps-2 display-5 project-title mb-0">{{ dashboard_title }}</h1>

        <a class="dashboard-add-data-button me-5" href="{{ url_for('project.create') }}">
            New Project
        </a>
    </div>
{% endblock %}

{% block dashboard_description %}
    <div class="container-fluid w-75 ms-0">
        <h1 class="desc small text-start py-3 mb-0">{{ description }}</h1>
    </div>
{% endblock %}

{% block main_content %}
    <h2 class="ps-2 section-header mt-4">Work in Progress...</h2>
<i class="bi bi-exclamation-triangle" style="font-size: 30rem"></i>
    
{% endblock %}
