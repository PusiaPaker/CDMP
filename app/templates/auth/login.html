{% extends './base.html' %}

{% block header %}
    <div class="container-fluid">
        <h1 class="ps-2 mb-5 display-3 project-title text-center">C.D.M.P</h1>
    </div>
{% endblock %}

{% block css %} 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="login-container container-fluid w-25 p-3">
    <form action="/login" method="POST">
        <legend class="text-center">{% block title %}Login{% endblock %}</legend> 
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input name="username" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="pass" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="mb-3 form-check checkbox-purp">
            <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="true">
            <label class="form-check-label" for="remember_me">Remember me for 30 days</label>
        </div>
        {% if error %}
        <p class="text-danger">{{error}}</p>
        {% endif %}
        <div class="mb-3">
            <button type="submit" class="btn btn-purp">Login</button>
        </div>
    </form>
    <a class="mb-0" href="{{ url_for('authentication.register') }}">Register</a>
</div>
{% endblock %}
