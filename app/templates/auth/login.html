{% extends './base.html' %}

{% block header %}
    <h1 class="ps-2 mb-5 display-3 project-title text-center">{% block title %}Login{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container-fluid text-center m-0 p-5">
        <h1>Register</h1>
        <form action="/login" method="POST" class="login">
            <input placeholder="Name" autocomplete="off" type="text" name="name" required>
            <input type="submit" value="Register">
        </form> 
    </div>
{% endblock %}

<form method="post">
    <input name = "id" placeholder = "Username" required>
    <input type = "password" name="password" placeholder="Password" required>

    <label>
        <input type="checkbox" name="remember_me" value ="true">
        Remember me for 30 days
    </label>

    <button type="submit">Login</button>
</form>
